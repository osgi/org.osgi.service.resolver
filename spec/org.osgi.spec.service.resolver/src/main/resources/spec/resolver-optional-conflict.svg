<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- mandatory A, optional B -->
  <rect x="20" y="20" width="150" height="56" fill="#E6E6E6" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="42" text-anchor="middle" font-weight="bold">A (mandatory)</text>
  <text x="95" y="60" text-anchor="middle">imports q, p [1,2)</text>

  <rect x="390" y="20" width="150" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="465" y="42" text-anchor="middle" font-weight="bold">B (optional)</text>
  <text x="465" y="60" text-anchor="middle">imports q, p [2,3)</text>

  <!-- M -->
  <rect x="205" y="110" width="150" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="280" y="132" text-anchor="middle" font-weight="bold">M</text>
  <text x="280" y="148" text-anchor="middle">exports q uses:="p"</text>
  <text x="280" y="162" text-anchor="middle">imports p</text>

  <!-- P1, P2 -->
  <rect x="20" y="210" width="150" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="95" y="232" text-anchor="middle" font-weight="bold">P1</text>
  <text x="95" y="248" text-anchor="middle">exports p 1.0</text>

  <rect x="390" y="210" width="150" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="465" y="232" text-anchor="middle" font-weight="bold">P2</text>
  <text x="465" y="248" text-anchor="middle">exports p 2.0</text>

  <!-- wires: A and B to M (q), A to P1 (p), B to P2 (p), M to P1 (p) -->
  <line x1="130" y1="76" x2="230" y2="110" stroke="#000000" marker-end="url(#arrow)"/>
  <text x="176" y="84">q</text>
  <line x1="430" y1="76" x2="330" y2="110" stroke="#000000" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="404" y="102">q</text>
  <line x1="60" y1="76" x2="60" y2="210" stroke="#000000" marker-end="url(#arrow)"/>
  <text x="48" y="150">p</text>
  <line x1="500" y1="76" x2="500" y2="210" stroke="#000000" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="508" y="150">p</text>
  <line x1="240" y1="166" x2="150" y2="210" stroke="#000000" marker-end="url(#arrow)"/>
  <text x="185" y="180">p</text>
  <line x1="320" y1="166" x2="420" y2="210" stroke="#000000" stroke-dasharray="2,4" marker-end="url(#arrow)"/>
  <text x="385" y="180">p</text>
</svg>
